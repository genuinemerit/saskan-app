# .github/workflows/typecheck.yml
name: typecheck
on: [push, pull_request]
jobs:
  mypy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pipx install poetry
      - run: poetry install --no-root
      - run: poetry run mypy .
