name: 💡 Feature Request
description: Suggest an idea or improvement for this project
title: "[Feature]: "
labels: [enhancement]
assignees: []

body:
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: If yes, describe the problem clearly. Example: "I'm always frustrated when..."
      placeholder: Describe the pain point this feature solves.
    validations:
      required: false

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: What would you like to see happen?
      placeholder: A clear and concise description of the feature.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or features you’ve thought about.
      placeholder: List other approaches you tried or considered.
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add screenshots, mockups, or related references if useful.
