name: "Feature request"
description: Propose a new capability or enhancement
title: "feat: <short title>"
labels: ["feat"]
assignees: []  # or ["stanniel"]

body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What do you want added and why?
      placeholder: One paragraph overview
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Bullet list of observable outcomes
      placeholder: |
        - CLI prints splash banner
        - Tests cover happy path
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope / Out of scope
      placeholder: |
        In scope:
        Out of scope:
  - type: textarea
    id: risks
    attributes:
      label: Risks / Notes
      placeholder: Any risks, migrations, or follow-ups
