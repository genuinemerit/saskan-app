name: "Bug report"
description: Report a defect
title: "fix: <short title>"
labels: ["fix"]
assignees: []

body:
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: 1) ... 2) ...
    validations:
      required: true
  - type: input
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: env
    attributes:
      label: Environment
      placeholder: OS, Python, package versions, logs
