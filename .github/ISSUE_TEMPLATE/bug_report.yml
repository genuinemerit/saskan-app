name: 🐛 Bug Report
description: Report a reproducible issue to help us improve
title: "[Bug]: "
labels: [bug]
assignees: []

body:
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of the issue.
      placeholder: What happened? What did you expect?
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Provide a minimal, reproducible example.
      placeholder: |
        1. Run command '...'
        2. Observe output '...'
        3. Expected '...'
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What should have happened instead?

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Details about your runtime environment.
      placeholder: |
        - OS: [e.g. Ubuntu 22.04]
        - Python version: [e.g. 3.11.5]
        - Project version: [e.g. 0.0.0a4]
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add logs, error messages, or screenshots if useful.
