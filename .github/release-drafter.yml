name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'

# Sections in the release notes
categories:
  - title: '✨ Features'
    labels: ['feat', 'feature']
  - title: '🐛 Fixes'
    labels: ['fix', 'bugfix', 'hotfix']
  - title: '⚡ Performance'
    labels: ['perf']
  - title: '🧼 Refactors'
    labels: ['refactor']
  - title: '📚 Docs'
    labels: ['docs']
  - title: '🧰 Maintenance'
    labels: ['chore', 'build', 'ci', 'dependencies', 'deps']
  - title: '🔒 Security'
    labels: ['security']

# How each merged PR renders
change-template: '- $TITLE (#$NUMBER) by @$AUTHOR'
no-changes-template: '- No user-facing changes.'

# Auto-bump version based on labels
version-resolver:
  major:
    labels: ['breaking-change', 'breaking']
  minor:
    labels: ['feat', 'feature']
  patch:
    labels: ['fix', 'bugfix', 'hotfix', 'perf', 'refactor', 'docs', 'chore', 'build', 'ci', 'dependencies', 'deps', 'security']
  default: patch

# Optional: exclude noise PRs from notes
exclude-labels:
  - 'skip-changelog'

# (Optional) add a header template
template: |
  ## Changes
  $CHANGES
